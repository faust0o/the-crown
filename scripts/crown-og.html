<!doctype html>
<!--
  Source for public/crown-og.png — the link-preview card for the game.

  Rendered with headless Chrome at 2x and downscaled, so the type stays crisp:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --force-device-scale-factor=2 \
      --screenshot=/tmp/crown-og@2x.png "file://$PWD/scripts/crown-og.html"
    sips -z 630 1200 /tmp/crown-og@2x.png --out public/crown-og.png

  The mark is public/crown-icon.svg inlined — keep the two in sync by hand.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        /* Same stack as src/index.css. */
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mark {
        width: 148px;
        height: 148px;
        display: block;
      }
      h1 {
        margin: 52px 0 0;
        font-size: 96px;
        font-weight: 300;
        letter-spacing: -0.03em;
        line-height: 1;
        color: oklch(0.145 0 0);
      }
      p {
        margin: 24px 0 0;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1;
        color: #737373;
      }
    </style>
  </head>
  <body>
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="2" fill="#b7791f" />
      <path
        d="M5.8 11 11.2 15.6 16 8.6 20.8 15.6 26.2 11 24.3 23.4 7.7 23.4Z"
        fill="#ffffff"
        stroke="#000000"
        stroke-width="2"
        stroke-linejoin="round"
        paint-order="stroke"
      />
    </svg>
    <h1>The crown.</h1>
    <p>Solana&rsquo;s top assets, ranked by volume</p>
  </body>
</html>
