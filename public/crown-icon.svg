<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="The Crown">
  <rect width="32" height="32" rx="2" fill="#b7791f" />
  <!--
    paint-order="stroke" draws the outline first and the white fill over it, so
    the stroke sits entirely outside the shape. A centred stroke would eat half
    its width out of the white, which closes the crown up at favicon sizes.
  -->
  <path
    d="M5.8 11 11.2 15.6 16 8.6 20.8 15.6 26.2 11 24.3 23.4 7.7 23.4Z"
    fill="#ffffff"
    stroke="#000000"
    stroke-width="2"
    stroke-linejoin="round"
    paint-order="stroke"
  />
</svg>
